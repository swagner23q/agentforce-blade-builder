<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Assembler</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { overflow: hidden; }
    .code-block {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.65;
      white-space: pre;
      overflow-x: auto;
      padding: 14px 16px;
      background: #0d1117;
      color: #e2e8f0;
      border-radius: 8px;
      margin: 0;
    }
    .code-tab { transition: color 0.1s, border-color 0.1s; }
    #code-drawer { transition: height 0.2s ease; }
    #add-menu .blade-btn {
      display: block; width: 100%;
      text-align: left;
      padding: 6px 10px;
      font-size: 12px; font-weight: 500;
      color: #d1d5db;
      background: none; border: none;
      border-radius: 6px; cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    #add-menu .blade-btn:hover { background: #374151; color: #fff; }
    .stack-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #111827;
      margin-bottom: 4px;
      user-select: none;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .stack-item.drag-over  { border-top: 2px solid #6366f1; }
    .stack-item.dragging   { opacity: 0.4; }
    .drag-handle { color: #4b5563; font-size: 14px; cursor: grab; flex-shrink: 0; line-height: 1; padding: 2px; }
    .drag-handle:active { cursor: grabbing; }
    .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .cat-dot-hero    { background: #818cf8; }
    .cat-dot-content { background: #38bdf8; }
    .cat-dot-social  { background: #34d399; }
    .item-label { flex: 1; font-size: 12px; font-weight: 500; color: #d1d5db; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .remove-btn { flex-shrink: 0; background: none; border: none; color: #4b5563; font-size: 13px; cursor: pointer; padding: 2px 5px; border-radius: 4px; line-height: 1; transition: color 0.1s, background 0.1s; }
    .remove-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }
  </style>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col">

  <!-- ── Header ── -->
  <header class="shrink-0 bg-gray-900 border-b border-gray-800 flex items-center gap-3 px-4 py-2">
    <span class="font-bold text-white tracking-tight text-sm">🧩 Page Assembler</span>
    <div class="w-px h-4 bg-gray-700"></div>
    <span class="text-xs text-gray-500">Add blades · drag to reorder · live preview</span>
    <div class="ml-auto flex items-center gap-3">
      <button onclick="exportHTML()" id="export-btn" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition-colors">Export HTML</button>
      <div class="w-px h-4 bg-gray-700"></div>
      <a href="blade-builder.html" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">← Blade Builder</a>
    </div>
  </header>

  <!-- ── Main ── -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left sidebar -->
    <div style="width:256px;min-width:256px" class="flex flex-col overflow-hidden border-r border-gray-800 bg-gray-900">

      <!-- Sidebar scroll container -->
      <div class="flex-1 flex flex-col overflow-y-auto min-h-0">

        <!-- Add blade button -->
        <div class="p-3 border-b border-gray-800 shrink-0">
          <button id="add-btn" onclick="toggleAddMenu()" class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition-colors">
            <span>+ Add Blade</span>
            <svg id="add-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" style="transition:transform 0.15s"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- Inline blade picker (expands in flow) -->
        <div id="add-menu" style="display:none" class="border-b border-gray-800 bg-gray-950 shrink-0">
          <div style="font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280;padding:10px 14px 4px">Hero &amp; Layout</div>
          <div class="px-2 pb-1">
            <button class="blade-btn" onclick="addBlade('promo')">Promo Blade</button>
            <button class="blade-btn" onclick="addBlade('aurora')">Aurora Hero</button>
            <button class="blade-btn" onclick="addBlade('glass')">Glass Hero</button>
            <button class="blade-btn" onclick="addBlade('split')">Split Screen</button>
            <button class="blade-btn" onclick="addBlade('parallax')">Parallax</button>
            <button class="blade-btn" onclick="addBlade('minimal')">Minimal Hero</button>
            <button class="blade-btn" onclick="addBlade('videohero')">Video Hero</button>
            <button class="blade-btn" onclick="addBlade('stickyscroll')">Sticky Scroll</button>
            <button class="blade-btn" onclick="addBlade('zigzag')">Zigzag</button>
          </div>
          <div style="font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280;padding:8px 14px 4px;border-top:1px solid #1f2937">Content</div>
          <div class="px-2 pb-1">
            <button class="blade-btn" onclick="addBlade('cards')">Card Grid</button>
            <button class="blade-btn" onclick="addBlade('bento')">Bento Grid</button>
            <button class="blade-btn" onclick="addBlade('tabs')">Feature Tabs</button>
            <button class="blade-btn" onclick="addBlade('reveal')">Scroll Reveal</button>
            <button class="blade-btn" onclick="addBlade('timeline')">Timeline</button>
          </div>
          <div style="font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280;padding:8px 14px 4px;border-top:1px solid #1f2937">Social &amp; Convert</div>
          <div class="px-2 pb-2">
            <button class="blade-btn" onclick="addBlade('stats')">Stats</button>
            <button class="blade-btn" onclick="addBlade('testi')">Testimonials</button>
            <button class="blade-btn" onclick="addBlade('logowall')">Logo Wall</button>
            <button class="blade-btn" onclick="addBlade('ctabanner')">CTA Banner</button>
          </div>
        </div>

        <!-- Empty state -->
        <div id="stack-empty" class="flex-1 flex flex-col items-center justify-center gap-3 p-6 text-center" style="min-height:120px">
          <span style="font-size:32px;opacity:0.25">🧩</span>
          <p class="text-xs text-gray-600 leading-relaxed">No blades yet.<br>Click <strong class="text-gray-500">+ Add Blade</strong> to start.</p>
        </div>

        <!-- Stack list -->
        <div id="stack-list" class="p-2" style="display:none"
          ondragover="event.preventDefault()"
          ondrop="onDropTrail(event)">
        </div>

      </div>

      <!-- Footer -->
      <div class="shrink-0 p-3 border-t border-gray-800 flex items-center justify-between">
        <span id="blade-count" class="text-xs text-gray-600">0 blades</span>
        <button onclick="clearAll()" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-red-900 text-gray-400 hover:text-red-300 transition-colors">Clear all</button>
      </div>
    </div>

    <!-- Right: preview + code drawer -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Preview bar -->
      <div class="shrink-0 flex items-center justify-between px-3 py-1.5 bg-gray-900 border-b border-gray-800">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Preview</span>
        <div class="flex items-center gap-2">
          <span id="preview-label" class="text-xs text-gray-600"></span>
          <button onclick="toggleCodeDrawer()" id="code-drawer-btn" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">{ } Code</button>
          <button onclick="refreshPreview()" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">Refresh</button>
        </div>
      </div>

      <!-- Preview iframe -->
      <iframe id="preview" class="flex-1 w-full border-0 bg-white min-h-0"></iframe>

      <!-- Code drawer -->
      <div id="code-drawer" class="shrink-0 flex flex-col border-t border-gray-800 bg-gray-950" style="height:0;overflow:hidden">

        <!-- Drawer header: tab bar + copy button -->
        <div class="shrink-0 flex items-center gap-0 px-3 border-b border-gray-800 bg-gray-900">
          <button onclick="setCodeTab('html')" data-tab="html" class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">HTML</button>
          <button onclick="setCodeTab('css')"  data-tab="css"  class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">CSS</button>
          <button onclick="setCodeTab('js')"   data-tab="js"   class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">JS</button>
          <div class="flex-1"></div>
          <button onclick="copyActiveTab()" id="copy-code-btn" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors mr-2">Copy all</button>
          <button onclick="toggleCodeDrawer()" class="text-gray-600 hover:text-gray-400 text-sm px-1 transition-colors" title="Close">✕</button>
        </div>

        <!-- Per-blade code panels -->
        <div id="code-content" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3"></div>

      </div>
    </div>

  </div>

        css: `.parallax-blade {

  overflow: hidden;
  display: flex;

  font-family: 'Salesforce Sans', Arial, sans-serif;

        js: `(function () {
  var blade  = document.querySelector('.parallax-blade');
  if (!blade) return;
  var layers = blade.querySelectorAll('[data-parallax-layer]');

  function onScroll() {
    var rect     = blade.getBoundingClientRect();
    var scrolled = -rect.top;
    layers.forEach(function(layer) {
      var speed  = parseFloat(layer.getAttribute('data-speed') || 0);
      layer.style.transform = 'translateY(' + (scrolled * speed) + 'px)';
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  blade.querySelectorAll('[data-cta]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('CTA clicked:', this.getAttribute('data-cta'));
    });
  });
})();`

        js: `(function () {
  function animateCount(card, target, suffix, duration) {
    var isDecimal = target % 1 !== 0;
    var el = card.querySelector('.stat-number');
    if (!el) return;
    var startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var ease = 1 - Math.pow(1 - progress, 3);
      el.textContent = (isDecimal ? (target * ease).toFixed(1) : Math.round(target * ease)) + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    el.textContent = '0' + suffix;
    requestAnimationFrame(step);
  }

  var observed = new Set();
  var cards = document.querySelectorAll('.stat-card');

  function trigger(card) {
    if (observed.has(card)) return;
    observed.add(card);
    animateCount(card, parseFloat(card.getAttribute('data-target')), card.getAttribute('data-suffix') || '', 1600);
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) { if (entry.isIntersecting) trigger(entry.target); });
    }, { threshold: 0.3 });
    cards.forEach(function(c) { observer.observe(c); });
  } else {
    cards.forEach(trigger);
  }
})();`

        js: `(function () {
  var btns   = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');

  btns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = this.getAttribute('data-tab');

      btns.forEach(function (b) { b.classList.remove('tab-active'); });
      panels.forEach(function (p) { p.classList.remove('tab-panel-active'); });

      this.classList.add('tab-active');
      var panel = document.getElementById('tab-' + target);
      if (panel) panel.classList.add('tab-panel-active');
    });
  });

  document.querySelectorAll('[data-cta]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      console.log('CTA:', this.getAttribute('data-cta'));
    });
  });
})();`

        js: `(function () {
  var steps = document.querySelectorAll('.reveal-step');

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    steps.forEach(function (s) { observer.observe(s); });
  } else {
    steps.forEach(function (s) { s.classList.add('is-visible'); });
  }

  // Trigger immediately for items already in view (iframe fallback)
  setTimeout(function () {
    steps.forEach(function (s) { s.classList.add('is-visible'); });
  }, 200);
})();`

        js: `(function () {
  var steps    = Array.from(document.querySelectorAll('.ss-step'));
  var progress = document.getElementById('ss-progress');
  if (!steps.length) return;

  function update() {
    var total    = steps.length;
    var active   = -1;
    var midY     = window.innerHeight / 2;

    steps.forEach(function (step, i) {
      var rect = step.getBoundingClientRect();
      step.classList.remove('ss-active');
      if (rect.top < midY && rect.bottom > 0) active = i;
    });

    if (active === -1) active = 0;
    steps[active].classList.add('ss-active');

    if (progress) {
      var pct = ((active + 1) / total) * 100;
      progress.style.height = pct + '%';
    }
  }

  window.addEventListener('scroll', update, { passive: true });
  // Activate first step immediately (iframe fallback)
  setTimeout(function () { steps[0] && steps[0].classList.add('ss-active'); }, 100);
})();`

    };

    // ─────────────────────────────────────────────────────────────────────────────
    // BLADE META
    // ─────────────────────────────────────────────────────────────────────────────
    var BLADE_META = {
      promo:        { label: 'Promo Blade'   },
      aurora:       { label: 'Aurora Hero'   },
      glass:        { label: 'Glass Hero'    },
      split:        { label: 'Split Screen'  },
      parallax:     { label: 'Parallax'      },
      minimal:      { label: 'Minimal Hero'  },
      videohero:    { label: 'Video Hero'    },
      stickyscroll: { label: 'Sticky Scroll' },
      zigzag:       { label: 'Zigzag'        },
      cards:        { label: 'Card Grid',    cat: 'content' },
      bento:        { label: 'Bento Grid',   cat: 'content' },
      tabs:         { label: 'Feature Tabs', cat: 'content' },
      reveal:       { label: 'Scroll Reveal',cat: 'content' },
      timeline:     { label: 'Timeline',     cat: 'content' },
      stats:        { label: 'Stats',        cat: 'social'  },
      testi:        { label: 'Testimonials', cat: 'social'  },
      logowall:     { label: 'Logo Wall',    cat: 'social'  },
      ctabanner:    { label: 'CTA Banner',   cat: 'social'  }
    };
    Object.keys(BLADE_META).forEach(function(k) {
      if (!BLADE_META[k].cat) BLADE_META[k].cat = 'hero';
    });

    // ─────────────────────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────────────────────
    var page   = [];
    var nextId = 1;
    var addMenuOpen = false;

    // ─────────────────────────────────────────────────────────────────────────────
    // ADD MENU
    // ─────────────────────────────────────────────────────────────────────────────
    function toggleAddMenu() {
      addMenuOpen = !addMenuOpen;
      document.getElementById('add-menu').style.display    = addMenuOpen ? 'block' : 'none';
      document.getElementById('add-chevron').style.transform = addMenuOpen ? 'rotate(180deg)' : '';
    }


    // ─────────────────────────────────────────────────────────────────────────────
    // PAGE MANAGEMENT
    // ─────────────────────────────────────────────────────────────────────────────
    function addBlade(key) {
      page.push({ id: nextId++, key: key });
      addMenuOpen = false;
      document.getElementById('add-menu').style.display    = 'none';
      document.getElementById('add-chevron').style.transform = '';
      renderStack();
      schedulePreview();
    }

    function removeBlade(id) {
      page = page.filter(function (b) { return b.id !== id; });
      renderStack();
      schedulePreview();
    }

    function clearAll() {
      if (!page.length) return;
      page = [];
      renderStack();
      refreshPreview();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // RENDER STACK
    // ─────────────────────────────────────────────────────────────────────────────
    function renderStack() {
      var list  = document.getElementById('stack-list');
      var empty = document.getElementById('stack-empty');
      var count = document.getElementById('blade-count');
      var label = document.getElementById('preview-label');
      var exportBtn = document.getElementById('export-btn');

      if (!page.length) {
        list.style.display  = 'none';
        empty.style.display = '';
        count.textContent   = '0 blades';
        label.textContent   = '';
        exportBtn.disabled  = true;
        exportBtn.classList.add('opacity-50', 'cursor-not-allowed');
        return;
      }

      empty.style.display = 'none';
      list.style.display  = 'block';
      var n = page.length;
      count.textContent   = n + ' blade' + (n !== 1 ? 's' : '');
      label.textContent   = n + ' blade' + (n !== 1 ? 's' : '') + ' · scroll preview to see full page';
      exportBtn.disabled  = false;
      exportBtn.classList.remove('opacity-50', 'cursor-not-allowed');

      list.innerHTML = page.map(function (b) {
        var meta = BLADE_META[b.key] || { label: b.key, cat: 'hero' };
        var id   = b.id;
        return '<div class="stack-item" data-id="' + id + '" draggable="true"'
          + ' ondragstart="onDragStart(event,' + id + ')"'
          + ' ondragend="onDragEnd(event,' + id + ')"'
          + ' ondragover="onDragOver(event,' + id + ')"'
          + ' ondrop="onDrop(event,' + id + ')">'
          + '<div class="drag-handle" title="Drag to reorder">&#8942;</div>'
          + '<span class="cat-dot cat-dot-' + meta.cat + '"></span>'
          + '<span class="item-label">' + meta.label + '</span>'
          + '<button class="remove-btn" onclick="removeBlade(' + id + ')" title="Remove">&#x2715;</button>'
          + '</div>';
      }).join('');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // DRAG AND DROP
    // ─────────────────────────────────────────────────────────────────────────────
    var dragId = null;

    function onDragStart(e, id) {
      dragId = id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(function () {
        var el = document.querySelector('.stack-item[data-id="' + id + '"]');
        if (el) el.classList.add('dragging');
      }, 0);
    }

    function onDragEnd(e, id) {
      var el = document.querySelector('.stack-item[data-id="' + id + '"]');
      if (el) el.classList.remove('dragging');
      document.querySelectorAll('.stack-item').forEach(function (el) {
        el.classList.remove('drag-over');
      });
      dragId = null;
    }

    function onDragOver(e, id) {
      e.preventDefault();
      e.stopPropagation();
      if (id === dragId) return;
      document.querySelectorAll('.stack-item').forEach(function (el) {
        el.classList.remove('drag-over');
      });
      e.currentTarget.classList.add('drag-over');
    }

    function onDrop(e, targetId) {
      e.preventDefault();
      e.stopPropagation();
      if (dragId === null || dragId === targetId) return;
      var fromIdx = -1, toIdx = -1;
      for (var i = 0; i < page.length; i++) {
        if (page[i].id === dragId)    fromIdx = i;
        if (page[i].id === targetId)  toIdx   = i;
      }
      if (fromIdx === -1 || toIdx === -1) return;
      var item = page.splice(fromIdx, 1)[0];
      page.splice(toIdx, 0, item);
      renderStack();
      schedulePreview();
    }

    function onDropTrail(e) {
      e.preventDefault();
      if (dragId === null) return;
      var fromIdx = -1;
      for (var i = 0; i < page.length; i++) {
        if (page[i].id === dragId) { fromIdx = i; break; }
      }
      if (fromIdx === -1) return;
      var item = page.splice(fromIdx, 1)[0];
      page.push(item);
      renderStack();
      schedulePreview();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // PREVIEW
    // ─────────────────────────────────────────────────────────────────────────────
    var debounceTimer;

    var SF_FONTS = '@font-face{font-display:swap;font-family:"Salesforce Sans";font-weight:400;src:url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Regular.woff2) format("woff2"),url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Regular.woff) format("woff")}'
      + '@font-face{font-display:swap;font-family:"Salesforce Sans";font-style:italic;font-weight:400;src:url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Italic.woff2) format("woff2"),url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Italic.woff) format("woff")}'
      + '@font-face{font-display:swap;font-family:"Salesforce Sans";font-weight:700;src:url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Bold.woff2) format("woff2"),url(https://a.sfdcstatic.com/shared/fonts/salesforce-sans/SalesforceSans-Bold.woff) format("woff")}'
      + '@font-face{font-display:swap;font-family:"ITC Avant Garde";font-weight:500;src:url(https://a.sfdcstatic.com/shared/fonts/avant-garde/AvantGardeForSalesforceW05-Dm.woff2) format("woff2"),url(https://a.sfdcstatic.com/shared/fonts/avant-garde/AvantGardeForSalesforceW05-Dm.woff) format("woff")}'
      + '*,*::before,*::after{box-sizing:border-box}'
      + 'body{margin:0;padding:0;font-family:"Salesforce Sans",Arial,sans-serif;font-size:16px;line-height:1.5;color:#444;-webkit-font-smoothing:antialiased}'
      + 'img{max-width:100%;display:block}';

    function buildDoc() {
      if (!page.length) {
        return '<!DOCTYPE html><html><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Salesforce Sans,Arial,sans-serif;color:#9ca3af;font-size:13px;flex-direction:column;gap:14px;background:#f9fafb">'
          + '<span style="font-size:40px;opacity:0.4">🧩</span>'
          + '<span>Add blades from the sidebar to preview your page</span>'
          + '</body></html>';
      }

      var css  = '';
      var html = '';
      var js   = '';

      page.forEach(function (b) {
        var t = templates[b.key];
        css  += t.css  + '\n\n';
        html += t.html + '\n\n';
        js   += 'try{\n' + t.js + '\n}catch(e){console.error(e)}\n\n';
      });

      return '<!DOCTYPE html><html lang="en"><head>'
        + '<meta charset="UTF-8"/>'
        + '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>'
        + '<style>' + SF_FONTS + '\n' + css + '</style>'
        + '</head><body style="margin:0;padding:0">'
        + html
        + '<script>\n' + js + '\n<\/script>'
        + '</body></html>';
    }

    function refreshPreview() {
      document.getElementById('preview').srcdoc = buildDoc();
    }

    function schedulePreview() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPreview, 300);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // EXPORT
    // ─────────────────────────────────────────────────────────────────────────────
    function exportHTML() {
      if (!page.length) return;

      var css  = '';
      var html = '';
      var js   = '';

      page.forEach(function (b) {
        var t    = templates[b.key];
        var meta = BLADE_META[b.key] || { label: b.key };
        css  += '/* ' + meta.label + ' */\n' + t.css  + '\n\n';
        html += '<!-- ' + meta.label + ' -->\n' + t.html + '\n\n';
        js   += '/* ' + meta.label + ' */\ntry{\n' + t.js + '\n}catch(e){console.error(e)}\n\n';
      });

      var sfFontsCleaned = SF_FONTS.replace(/}(?=[^}])/g, '}\n');

      var doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n'
        + '  <meta charset="UTF-8" />\n'
        + '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n'
        + '  <title>My Page</title>\n'
        + '  <style>\n' + sfFontsCleaned + '\n\n' + css + '  </style>\n'
        + '</head>\n<body>\n\n'
        + html
        + '<script>\n' + js + '\n<\/script>\n'
        + '</body>\n</html>';

      var blob = new Blob([doc], { type: 'text/html' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href   = url;
      a.download = 'assembled-page.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // CODE DRAWER
    // ─────────────────────────────────────────────────────────────────────────────
    var drawerOpen  = false;
    var activeTab   = 'html';
    var DRAWER_H    = '340px';

    function toggleCodeDrawer() {
      drawerOpen = !drawerOpen;
      var drawer = document.getElementById('code-drawer');
      var btn    = document.getElementById('code-drawer-btn');
      drawer.style.height   = drawerOpen ? DRAWER_H : '0';
      drawer.style.overflow = drawerOpen ? 'hidden' : 'hidden';
      btn.classList.toggle('text-indigo-400', drawerOpen);
      if (drawerOpen) renderCodeDrawer();
    }

    function setCodeTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.code-tab').forEach(function (b) {
        var isActive = b.getAttribute('data-tab') === tab;
        b.classList.toggle('border-indigo-400', isActive);
        b.classList.toggle('text-white',        isActive);
        b.classList.toggle('border-transparent',!isActive);
        b.classList.toggle('text-gray-500',     !isActive);
      });
      renderCodeDrawer();
    }

    function renderCodeDrawer() {
      var content = document.getElementById('code-content');
      if (!page.length) {
        content.innerHTML = '<p class="text-xs text-gray-600 p-2">Add blades to see code.</p>';
        return;
      }

      content.innerHTML = page.map(function (b) {
        var t    = templates[b.key];
        var meta = BLADE_META[b.key] || { label: b.key };
        var code = activeTab === 'html' ? t.html : activeTab === 'css' ? t.css : t.js;
        var escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var colorClass = activeTab === 'html' ? 'text-orange-400' : activeTab === 'css' ? 'text-sky-400' : 'text-yellow-400';
        return '<div>'
          + '<div class="flex items-center justify-between mb-1.5">'
          + '<span class="text-xs font-bold ' + colorClass + ' uppercase tracking-widest">' + meta.label + '</span>'
          + '<button onclick="copyBlock(this)" data-code="' + encodeURIComponent(code) + '" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">Copy</button>'
          + '</div>'
          + '<pre class="code-block">' + escaped + '</pre>'
          + '</div>';
      }).join('');
    }

    function copyBlock(btn) {
      var code = decodeURIComponent(btn.getAttribute('data-code'));
      navigator.clipboard.writeText(code).then(function () {
        var orig = btn.textContent;
        btn.textContent = 'Copied ✓';
        btn.classList.add('text-emerald-400');
        setTimeout(function () {
          btn.textContent = orig;
          btn.classList.remove('text-emerald-400');
        }, 1500);
      });
    }

    function copyActiveTab() {
      if (!page.length) return;
      var allCode = page.map(function (b) {
        var t    = templates[b.key];
        var meta = BLADE_META[b.key] || { label: b.key };
        var code = activeTab === 'html' ? t.html : activeTab === 'css' ? t.css : t.js;
        return '/* ' + meta.label + ' */\n' + code;
      }).join('\n\n');
      var btn = document.getElementById('copy-code-btn');
      navigator.clipboard.writeText(allCode).then(function () {
        btn.textContent = 'Copied ✓';
        btn.classList.add('text-emerald-400');
        setTimeout(function () {
          btn.textContent = 'Copy all';
          btn.classList.remove('text-emerald-400');
        }, 1500);
      });
    }

    // Re-render drawer content when page changes (if open)
    var _origRenderStack = renderStack;
    renderStack = function () {
      _origRenderStack();
      if (drawerOpen) renderCodeDrawer();
    };

    // Set initial active tab styling
    setCodeTab('html');

    // ─────────────────────────────────────────────────────────────────────────────
    // BOOT
    // ─────────────────────────────────────────────────────────────────────────────
    renderStack();
    refreshPreview();

  </script>
</body>
