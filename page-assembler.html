<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Assembler — Open Blade Templates</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { overflow: hidden; }
    .code-block {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.65;
      white-space: pre;
      overflow-x: auto;
      padding: 14px 16px;
      background: #0d1117;
      color: #e2e8f0;
      border-radius: 8px;
      margin: 0;
    }
    .code-tab { transition: color 0.1s, border-color 0.1s; }
    #code-drawer { transition: height 0.2s ease; }
    #sidebar { transition: width 0.2s ease, min-width 0.2s ease; }
    #sidebar.collapsed { width: 40px !important; min-width: 40px !important; }
    #sidebar.collapsed .sidebar-content { display: none; }
    #sidebar-toggle { flex-shrink: 0; background: none; border: none; color: #6b7280; cursor: pointer; padding: 4px; border-radius: 4px; line-height: 1; transition: color 0.1s, background 0.1s; }
    #sidebar-toggle:hover { color: #d1d5db; background: #1f2937; }
    #sidebar-collapsed-indicator { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; }
    #sidebar.collapsed #sidebar-collapsed-indicator { display: flex; }
    #sidebar-collapsed-count { font-size: 10px; font-weight: 700; color: #6b7280; writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 0.05em; }
    #add-menu { overflow: hidden; }
    .picker-tabs { display: flex; border-bottom: 1px solid #1f2937; }
    .picker-tab {
      flex: 1; padding: 6px 4px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: #4b5563; background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }
    .picker-tab:hover { color: #9ca3af; }
    .picker-tab.active { color: #e5e7eb; border-bottom-color: #6366f1; }
    .picker-tab.active.sf { border-bottom-color: #00a1e0; color: #38bdf8; }
    .picker-tab.active.pages { border-bottom-color: #10b981; color: #34d399; }
    .picker-panel { display: none; padding: 8px; }
    .picker-panel.active { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .picker-panel.active.pages-panel { display: flex; flex-direction: column; gap: 6px; }
    .preset-card {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 12px;
      background: #111827; border: 1px solid #1f2937;
      border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
    }
    .preset-card:hover { border-color: #374151; background: #1a2233; }
    .preset-card-name { font-size: 12px; font-weight: 700; color: #e5e7eb; }
    .preset-card-desc { font-size: 10.5px; color: #6b7280; line-height: 1.4; }
    .preset-card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
    .preset-tag {
      font-size: 9.5px; font-weight: 600; color: #9ca3af;
      background: #1f2937; border-radius: 4px;
      padding: 1px 6px; letter-spacing: 0.04em;
    }
    .preset-load-btn {
      align-self: flex-start; margin-top: 2px;
      font-size: 10px; font-weight: 700; color: #34d399;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25);
      border-radius: 5px; padding: 3px 10px; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .preset-load-btn:hover { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.5); }
    .blade-btn {
      text-align: left;
      padding: 5px 8px;
      font-size: 11.5px; font-weight: 500;
      color: #d1d5db;
      background: none; border: none;
      border-radius: 6px; cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .blade-btn:hover { background: #374151; color: #fff; }
    .stack-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #111827;
      margin-bottom: 4px;
      user-select: none;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .stack-item.drag-over  { border-top: 2px solid #6366f1; }
    .stack-item.dragging   { opacity: 0.4; }
    .drag-handle { color: #4b5563; font-size: 14px; cursor: grab; flex-shrink: 0; line-height: 1; padding: 2px; }
    .drag-handle:active { cursor: grabbing; }
    .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .cat-dot-hero    { background: #818cf8; }
    .cat-dot-content { background: #38bdf8; }
    .cat-dot-social  { background: #34d399; }
    .cat-dot-sf      { background: #00a1e0; }
    .item-label { flex: 1; font-size: 12px; font-weight: 500; color: #d1d5db; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-label:hover { color: #a5b4fc; }
    .remove-btn { flex-shrink: 0; background: none; border: none; color: #4b5563; font-size: 13px; cursor: pointer; padding: 2px 5px; border-radius: 4px; line-height: 1; transition: color 0.1s, background 0.1s; }
    .remove-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }
  </style>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col">

  <!-- ── Header ── -->
  <header class="shrink-0 bg-gray-900 border-b border-gray-800 flex items-center gap-3 px-4 py-2">
    <span class="font-bold text-white tracking-tight text-sm">🧩 Page Assembler — Open Blade Templates</span>
    <div class="w-px h-4 bg-gray-700"></div>
    <span class="text-xs text-gray-500">Add blades · drag to reorder · live preview</span>
    <div class="w-px h-4 bg-gray-700"></div>
    <span id="active-preset-label" class="text-xs font-semibold" style="color:#00a1e0;">Agentforce Voice</span>
    <div class="ml-auto flex items-center gap-3">
      <!-- Pages dropdown -->
      <div class="relative" id="pages-menu-wrap">
        <button onclick="togglePagesMenu()" id="pages-menu-btn"
          class="text-xs px-2 py-0.5 rounded border border-emerald-800 bg-emerald-950 hover:bg-emerald-900 text-emerald-400 font-semibold transition-colors flex items-center gap-1">
          Pages <span style="font-size:9px">&#9660;</span>
        </button>
        <div id="pages-menu" style="display:none" class="absolute right-0 top-full mt-1 w-64 bg-gray-900 border border-gray-700 rounded-lg shadow-xl z-50 overflow-hidden">
          <div class="px-3 py-2 border-b border-gray-800">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Pre-assembled Pages</p>
          </div>
          <div class="p-2 flex flex-col gap-1">
            <button onclick="loadPreset('af-voice');closePagesMenu()" class="text-left px-3 py-2 rounded-md hover:bg-gray-800 transition-colors">
              <div class="text-xs font-semibold text-white">Agentforce Voice</div>
              <div class="text-xs text-gray-500 mt-0.5">Aurora hero · Stats · Tabs · Patch Notes · Roadmap · Social Proof · CTA</div>
            </button>
            <button onclick="loadPreset('how-it-works');closePagesMenu()" class="text-left px-3 py-2 rounded-md hover:bg-gray-800 transition-colors">
              <div class="text-xs font-semibold text-white">How Agentforce Works</div>
              <div class="text-xs text-gray-500 mt-0.5">Marquee · Text · Product Feature ×3 · Promotion ×2 · Contact Us · FAQ</div>
            </button>
          </div>
        </div>
      </div>
      <a href="open-blade-templates.html" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">← Open Blade Templates</a>
    </div>
  </header>

  <!-- ── Main ── -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left sidebar -->
    <div id="sidebar" style="width:256px;min-width:256px" class="flex flex-col overflow-hidden border-r border-gray-800 bg-gray-900">

      <!-- Collapse toggle strip -->
      <div class="shrink-0 flex items-center justify-between px-2 py-1.5 border-b border-gray-800 sidebar-content">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Blades</span>
        <button id="sidebar-toggle" onclick="toggleSidebar()" title="Collapse sidebar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- Collapsed indicator -->
      <div id="sidebar-collapsed-indicator">
        <button onclick="toggleSidebar()" title="Expand sidebar" style="background:none;border:none;color:#6b7280;cursor:pointer;padding:4px;border-radius:4px;transition:color 0.1s" onmouseover="this.style.color='#d1d5db'" onmouseout="this.style.color='#6b7280'">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2L10 7L5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="sidebar-collapsed-count" class="text-xs text-gray-600">0</span>
      </div>

      <!-- Sidebar scroll container -->
      <div class="flex-1 flex flex-col overflow-y-auto min-h-0 sidebar-content">

        <!-- Add blade button -->
        <div class="p-3 border-b border-gray-800 shrink-0">
          <button id="add-btn" onclick="toggleAddMenu()" class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition-colors">
            <span>+ Add Blade</span>
            <svg id="add-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" style="transition:transform 0.15s"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- Blade picker -->
        <div id="add-menu" style="display:none" class="border-b border-gray-800 bg-gray-950 shrink-0">
          <!-- Search -->
          <div class="px-2 pt-2 pb-1">
            <input id="picker-search" type="text" placeholder="Search blades…" oninput="filterPickerBlades(this.value)"
              class="w-full bg-gray-800 border border-gray-700 rounded-md text-xs text-gray-200 placeholder-gray-600 px-2 py-1.5 outline-none focus:border-indigo-500 transition-colors" />
          </div>
          <!-- Search results (flat list, shown only when searching) -->
          <div id="picker-search-results" style="display:none" class="px-2 pb-2 grid grid-cols-2 gap-0.5"></div>
          <!-- Tabs (hidden when searching) -->
          <div id="picker-tabs-wrap">
          <div class="picker-tabs">
            <button class="picker-tab active" onclick="switchPickerTab('hero', this)">Hero</button>
            <button class="picker-tab" onclick="switchPickerTab('content', this)">Content</button>
            <button class="picker-tab" onclick="switchPickerTab('social', this)">Social</button>
            <button class="picker-tab sf" onclick="switchPickerTab('sf', this)">SF</button>
          </div>
          <div id="picker-hero" class="picker-panel active">
            <button class="blade-btn" onclick="addBlade('promo')">Promo Blade</button>
            <button class="blade-btn" onclick="addBlade('aurora')">Aurora Hero</button>
            <button class="blade-btn" onclick="addBlade('glass')">Glass Hero</button>
            <button class="blade-btn" onclick="addBlade('split')">Split Screen</button>
            <button class="blade-btn" onclick="addBlade('parallax')">Parallax</button>
            <button class="blade-btn" onclick="addBlade('minimal')">Minimal Hero</button>
            <button class="blade-btn" onclick="addBlade('videohero')">Video Hero</button>
            <button class="blade-btn" onclick="addBlade('stickyscroll')">Sticky Scroll</button>
            <button class="blade-btn" onclick="addBlade('zigzag')">Zigzag</button>
          </div>
          <div id="picker-content" class="picker-panel">
            <button class="blade-btn" onclick="addBlade('cards')">Card Grid</button>
            <button class="blade-btn" onclick="addBlade('bento')">Bento Grid</button>
            <button class="blade-btn" onclick="addBlade('tabs')">Feature Tabs</button>
            <button class="blade-btn" onclick="addBlade('reveal')">Scroll Reveal</button>
            <button class="blade-btn" onclick="addBlade('timeline')">Timeline</button>
            <button class="blade-btn" onclick="addBlade('pillars')">Dark Pillars</button>
            <button class="blade-btn" onclick="addBlade('chatspot')">Chat Spotlight</button>
            <button class="blade-btn" onclick="addBlade('patchnotes')">Patch Notes</button>
            <button class="blade-btn" onclick="addBlade('roadmap')">Release Roadmap</button>
            <button class="blade-btn" onclick="addBlade('slidingcards')">Sliding Cards</button>
            <button class="blade-btn" onclick="addBlade('slidingcardsv2')">Sliding Cards v2</button>
          </div>
          <div id="picker-social" class="picker-panel">
            <button class="blade-btn" onclick="addBlade('stats')">Stats</button>
            <button class="blade-btn" onclick="addBlade('testi')">Testimonials</button>
            <button class="blade-btn" onclick="addBlade('logowall')">Logo Wall</button>
            <button class="blade-btn" onclick="addBlade('ctabanner')">CTA Banner</button>
            <button class="blade-btn" onclick="addBlade('quotegrid')">Quote Grid</button>
            <button class="blade-btn" onclick="addBlade('trustbadges')">Trust Badges</button>
            <button class="blade-btn" onclick="addBlade('socialproof')">Social Proof</button>
          </div>
          <div id="picker-sf" class="picker-panel">
            <button class="blade-btn" onclick="addBlade('sfmarquee')">Marquee</button>
            <button class="blade-btn" onclick="addBlade('sfmarqueecenter')">Marquee (Center)</button>
            <button class="blade-btn" onclick="addBlade('sfmarqueenoimage')">Marquee (No Img)</button>
            <button class="blade-btn" onclick="addBlade('sfpromo')">Promo</button>
            <button class="blade-btn" onclick="addBlade('sffaq')">FAQ</button>
          </div>
          </div><!-- /picker-tabs-wrap -->
        </div>

        <!-- Empty state -->
        <div id="stack-empty" class="flex-1 flex flex-col items-center justify-center gap-3 p-6 text-center" style="min-height:120px">
          <span style="font-size:32px;opacity:0.25">🧩</span>
          <p class="text-xs text-gray-600 leading-relaxed">No blades yet.<br>Click <strong class="text-gray-500">+ Add Blade</strong> to start.</p>
        </div>

        <!-- Stack list -->
        <div id="stack-list" class="p-2" style="display:none"
          ondragover="event.preventDefault()"
          ondrop="onDropTrail(event)">
        </div>

      </div>

      <!-- Footer -->
      <div class="shrink-0 p-3 border-t border-gray-800 flex items-center justify-between sidebar-content">
        <span id="blade-count" class="text-xs text-gray-600">0 blades</span>
        <button onclick="clearAll()" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-red-900 text-gray-400 hover:text-red-300 transition-colors">Clear all</button>
      </div>
    </div>

    <!-- Right: preview + code drawer -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Preview bar -->
      <div class="shrink-0 flex items-center justify-between px-3 py-1.5 bg-gray-900 border-b border-gray-800">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Preview</span>
        <div class="flex items-center gap-2">
          <span id="preview-label" class="text-xs text-gray-600"></span>
          <!-- Width toggle -->
          <div class="flex items-center rounded overflow-hidden border border-gray-700" style="font-size:11px">
            <button id="pw-desktop" onclick="setPreviewWidth('desktop')" class="px-2 py-0.5 bg-gray-700 text-white transition-colors" title="Desktop">Desktop</button>
            <button id="pw-tablet"  onclick="setPreviewWidth('tablet')"  class="px-2 py-0.5 bg-gray-800 text-gray-500 hover:bg-gray-700 transition-colors" title="Tablet (1024px)">Tablet</button>
            <button id="pw-mobile"  onclick="setPreviewWidth('mobile')"  class="px-2 py-0.5 bg-gray-800 text-gray-500 hover:bg-gray-700 transition-colors" title="Mobile (390px)">Mobile</button>
          </div>
          <button onclick="toggleCodeDrawer()" id="code-drawer-btn" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">{ } Code</button>
          <button onclick="refreshPreview()" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors">Refresh</button>
        </div>
      </div>

      <!-- Preview iframe wrapper (centres iframe when in mobile mode) -->
      <div id="preview-wrap" class="flex-1 overflow-hidden bg-gray-950 min-h-0 flex justify-center">
        <iframe id="preview" class="border-0 bg-white h-full" style="width:100%"></iframe>
      </div>

      <!-- Code drawer -->
      <div id="code-drawer" class="shrink-0 flex flex-col border-t border-gray-800 bg-gray-950" style="height:0;overflow:hidden">

        <!-- Drawer header: tab bar + copy button -->
        <div class="shrink-0 flex items-center gap-0 px-3 border-b border-gray-800 bg-gray-900">
          <button onclick="setCodeTab('html')" data-tab="html" class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">HTML</button>
          <button onclick="setCodeTab('css')"  data-tab="css"  class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">CSS</button>
          <button onclick="setCodeTab('js')"   data-tab="js"   class="code-tab text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 uppercase tracking-widest">JS</button>
          <div class="flex-1"></div>
          <button onclick="copyActiveTab()" id="copy-code-btn" class="text-xs px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors mr-2">Copy all</button>
          <button onclick="toggleCodeDrawer()" class="text-gray-600 hover:text-gray-400 text-sm px-1 transition-colors" title="Close">✕</button>
        </div>

        <!-- Per-blade code panels -->
        <div id="code-content" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3"></div>

      </div>
    </div>

  </div>

  <script>
    const templates = {
      // ── CARD GRID ──────────────────────────────────────────────────────────────
      cards: {
        anchor: 'agentforce-card-grid',
        html: `<section class="cards-section">
  <div class="section-header">
    <p class="eyebrow">What Agentforce Can Do</p>
    <h2 class="section-title">AI Built for Every Team</h2>
    <p class="section-sub">Autonomous agents that work alongside your people — across every department.</p>
  </div>
  <div class="cards-grid">

    <article class="card" data-card="sales">
      <div class="card-icon">🤖</div>
      <h3 class="card-title">Sales</h3>
      <p class="card-body">Research accounts, draft outreach, and surface the right insights — automatically, at scale.</p>
      <a href="#" class="card-link">Explore Sales Agents →</a>
    </article>

    <article class="card" data-card="service">
      <div class="card-icon">💬</div>
      <h3 class="card-title">Service</h3>
      <p class="card-body">Resolve cases faster with agents that handle routine requests and escalate when it matters.</p>
      <a href="#" class="card-link">Explore Service Agents →</a>
    </article>

    <article class="card" data-card="marketing">
      <div class="card-icon">📊</div>
      <h3 class="card-title">Marketing</h3>
      <p class="card-body">Launch personalized campaigns at scale — from segment to send — with AI that knows your audience.</p>
      <a href="#" class="card-link">Explore Marketing Agents →</a>
    </article>

  </div>
</section>`,
        css: `#agentforce-card-grid {
  position: relative;
  background: linear-gradient(160deg, #1248f2 0%, #0a2cc4 100%);
  padding: 72px 32px;
  font-family: 'Salesforce Sans', Arial, sans-serif;
}

#agentforce-card-grid::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 100% 0%, rgba(255,255,255,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 0% 100%, rgba(6,193,228,0.40) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
#agentforce-card-grid .section-inner-wrap {
  position: relative; z-index: 1;
}

#agentforce-card-grid .section-header{
  text-align: center;
  max-width: 640px;
  margin: 0 auto 52px;
}

#agentforce-card-grid .eyebrow{
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #06c1e4;
  margin: 0 0 12px;
}

#agentforce-card-grid .section-title{
  font-size: 40px;
  font-weight: 800;
  color: #fff;
  margin: 0 0 16px;
  line-height: 1.15;
}

#agentforce-card-grid .section-sub{
  font-size: 17px;
  color: rgba(255,255,255,0.6);
  margin: 0;
  line-height: 1.65;
}

#agentforce-card-grid .cards-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  max-width: 1080px;
  margin: 0 auto;
}

#agentforce-card-grid .card{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 8px 32px rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 36px 28px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#agentforce-card-grid .card:hover{
  transform: translateY(-5px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 16px 48px rgba(0,0,0,0.4);
  background: rgba(255,255,255,0.08);
}

#agentforce-card-grid .card-icon{ font-size: 36px; margin-bottom: 20px; }

#agentforce-card-grid .card-title{
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 12px;
}

#agentforce-card-grid .card-body{
  font-size: 15px;
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
  margin: 0 0 24px;
}

#agentforce-card-grid .card-link{
  font-size: 14px;
  font-weight: 600;
  color: #1469f8;
  text-decoration: none;
}

#agentforce-card-grid .card-link:hover{ text-decoration: underline; }

@media (max-width: 768px) {
  #agentforce-card-grid .cards-grid{ grid-template-columns: 1fr; }
  #agentforce-card-grid .section-title{ font-size: 30px; }

        js: `(function () {
  var blade  = document.querySelector('.parallax-blade');
  if (!blade) return;
  var layers = blade.querySelectorAll('[data-parallax-layer]');

  function onScroll() {
    var rect     = blade.getBoundingClientRect();
    var scrolled = -rect.top;
    layers.forEach(function(layer) {
      var speed  = parseFloat(layer.getAttribute('data-speed') || 0);
      layer.style.transform = 'translateY(' + (scrolled * speed) + 'px)';
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  blade.querySelectorAll('[data-cta]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('CTA clicked:', this.getAttribute('data-cta'));
    });
  });
})();`

        js: `(function () {
  function animateCount(card, target, suffix, duration) {
    var isDecimal = target % 1 !== 0;
    var el = card.querySelector('.stat-number');
    if (!el) return;
    var startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var ease = 1 - Math.pow(1 - progress, 3);
      el.textContent = (isDecimal ? (target * ease).toFixed(1) : Math.round(target * ease)) + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    el.textContent = '0' + suffix;
    requestAnimationFrame(step);
  }

  var observed = new Set();
  var cards = document.querySelectorAll('.stat-card');

  function trigger(card) {
    if (observed.has(card)) return;
    observed.add(card);
    animateCount(card, parseFloat(card.getAttribute('data-target')), card.getAttribute('data-suffix') || '', 1600);
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) { if (entry.isIntersecting) trigger(entry.target); });
    }, { threshold: 0.1 });
    cards.forEach(function(c) { observer.observe(c); });
  } else {
    cards.forEach(trigger);
  }
})();`

        js: `(function () {
  var btns   = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');

  btns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = this.getAttribute('data-tab');

      btns.forEach(function (b) { b.classList.remove('tab-active'); });
      panels.forEach(function (p) { p.classList.remove('tab-panel-active'); });

      this.classList.add('tab-active');
      var panel = document.getElementById('tab-' + target);
      if (panel) panel.classList.add('tab-panel-active');
    });
  });

  document.querySelectorAll('[data-cta]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      console.log('CTA:', this.getAttribute('data-cta'));
    });
  });
})();`

        js: `(function () {
  var steps = document.querySelectorAll('.reveal-step');

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    steps.forEach(function (s) { observer.observe(s); });
  } else {
    steps.forEach(function (s) { s.classList.add('is-visible'); });
  }

  // Trigger immediately for items already in view (iframe fallback)
  setTimeout(function () {
    steps.forEach(function (s) { s.classList.add('is-visible'); });
  }, 200);
})();`

        js: `(function () {
  var steps    = Array.from(document.querySelectorAll('.ss-step'));
  var progress = document.getElementById('ss-progress');
  if (!steps.length) return;

  function update() {
    var total    = steps.length;
    var active   = -1;
    var midY     = window.innerHeight / 2;

    steps.forEach(function (step, i) {
      var rect = step.getBoundingClientRect();
      step.classList.remove('ss-active');
      if (rect.top < midY && rect.bottom > 0) active = i;
    });

    if (active === -1) active = 0;
    steps[active].classList.add('ss-active');

    if (progress) {
      var pct = ((active + 1) / total) * 100;
      progress.style.height = pct + '%';
    }
  }

  window.addEventListener('scroll', update, { passive: true });
  setTimeout(update, 100);
})();`

}`,
        js: `(function () {
  var steps   = document.querySelectorAll('.cs-step');
  var typing  = document.getElementById('cs-typing');
  var resolve = document.getElementById('cs-resolve');
  var followup = document.getElementById('cs-followup');
  var close   = document.getElementById('cs-close');

  if (!typing) return;

  function setStep(n) {
    steps.forEach(function (s) { s.classList.remove('cs-step-active'); });
    if (steps[n]) steps[n].classList.add('cs-step-active');
  }

  steps.forEach(function (s) {
    s.addEventListener('click', function () {
      setStep(parseInt(this.getAttribute('data-step')));
    });
  });

  setTimeout(function () {
    setStep(1);
    setTimeout(function () {
      typing.style.display = 'none';
      resolve.style.display = '';
      setStep(2);
      setTimeout(function () {
        followup.style.display = '';
        setTimeout(function () { close.style.display = ''; }, 800);
      }, 1000);
    }, 1800);
  }, 1200);
})();`

        js: `(function() {
  var section = document.getElementById('agentforce-patch-notes');
  if (!section) return;
  var grid = section.querySelector('#pn-grid');
  if (!grid) return;
  var activeFilter = 'all';

  function applyFilter(filter) {
    activeFilter = filter;
    Array.from(grid.querySelectorAll('.pn-card')).forEach(function(card) {
      var match = filter === 'all' || card.getAttribute('data-type') === filter;
      card.classList.toggle('is-hidden', !match);
    });
    section.querySelectorAll('.pn-filter').forEach(function(btn) {
      btn.classList.toggle('pn-filter--active', btn.getAttribute('data-filter') === filter);
    });
  }

  section.querySelectorAll('.pn-filter').forEach(function(btn) {
    btn.addEventListener('pointerdown', function() {
      btn.style.transform = 'translateY(4px) scale(1)';
      btn.style.boxShadow = '0 0 0 transparent, inset 0 3px 6px rgba(0,0,0,0.3)';
      btn.style.transition = 'transform 0.05s ease, box-shadow 0.05s ease';
      var willBeActive = btn.getAttribute('data-filter') !== activeFilter;
      applyFilter(btn.getAttribute('data-filter'));
      setTimeout(function() {
        if (!willBeActive) { btn.style.transform = ''; btn.style.boxShadow = ''; btn.style.transition = ''; }
      }, 80);
    });
  });

  applyFilter('all');
})();`

        js: `(function() {
  var section = document.getElementById('agentforce-social-proof');
  if (!section) return;

  function animateCount(el, target, suffix, duration) {
    var numEl = el.querySelector('.sp-stat-number');
    if (!numEl) return;
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var ease = 1 - Math.pow(1 - progress, 3);
      numEl.textContent = Math.round(target * ease) + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var triggered = false;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting && !triggered) {
        triggered = true;
        section.querySelectorAll('.sp-stat').forEach(function(el) {
          animateCount(el, parseInt(el.getAttribute('data-target')), el.getAttribute('data-suffix'), 1400);
        });
        obs.disconnect();
      }
    });
  }, { threshold: 0.2 });
  var statsEl = section.querySelector('.sp-stats');
  if (statsEl) obs.observe(statsEl);
})();`

        js: `(function () {
  var track = document.querySelector('#agentforce-sliding-cards .sc-track');
  if (!track) return;

  var cards = Array.from(track.querySelectorAll('.sc-card'));

  function activate(card) {
    cards.forEach(function (c) {
      c.classList.toggle('sc-card--active', c === card);
      c.style.zIndex = c === card ? 2 : 1;
    });
  }

  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      if (card.classList.contains('sc-card--active')) {
        activate(cards[0]);
      } else {
        activate(card);
      }
    });
  });
})();`

      var code = decodeURIComponent(btn.getAttribute('data-code'));
      navigator.clipboard.writeText(code).then(function () {
        var orig = btn.textContent;
        btn.textContent = 'Copied ✓';
        btn.classList.add('text-emerald-400');
        setTimeout(function () {
          btn.textContent = orig;
          btn.classList.remove('text-emerald-400');
        }, 1500);
      });
    }

    function copyActiveTab() {
      if (!page.length) return;
      var allCode = page.map(function (b) {
        var t    = templates[b.key];
        var meta = BLADE_META[b.key] || { label: b.key };
        var code = activeTab === 'html' ? t.html : activeTab === 'css' ? t.css : t.js;
        return '/* ' + meta.label + ' */\n' + code;
      }).join('\n\n');
      var btn = document.getElementById('copy-code-btn');
      navigator.clipboard.writeText(allCode).then(function () {
        btn.textContent = 'Copied ✓';
        btn.classList.add('text-emerald-400');
        setTimeout(function () {
          btn.textContent = 'Copy all';
          btn.classList.remove('text-emerald-400');
        }, 1500);
      });
    }

    // Re-render drawer content when page changes (if open)
    var _origRenderStack = renderStack;
    renderStack = function () {
      _origRenderStack();
      if (drawerOpen) renderCodeDrawer();
    };

    // Set initial active tab styling
    setCodeTab('html');

    // ─────────────────────────────────────────────────────────────────────────────
    // PRESETS
    // ─────────────────────────────────────────────────────────────────────────────
    var PRESETS = {
      'af-voice': {
        label: 'Agentforce Voice',
        blades: ['aurora', 'stats', 'stickyscroll', 'tabs', 'patchnotes', 'roadmap', 'socialproof', 'logowall', 'ctabanner']
      },
      'how-it-works': {
        label: 'How Agentforce Works',
        blades: ['sfmarqueecenter', 'stickyscroll', 'stickyscroll', 'stickyscroll', 'sfpromo', 'sfpromo', 'ctabanner', 'sffaq']
      }
    };

    function loadPreset(key) {
      var preset = PRESETS[key];
      if (!preset) return;
      page = [];
      nextId = 1;
      preset.blades.forEach(function(bladeKey) {
        page.push({ id: nextId++, key: bladeKey });
      });
      var labelEl = document.getElementById('active-preset-label');
      if (labelEl) labelEl.textContent = preset.label;
      renderStack();
      refreshPreview();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // BOOT — empty canvas
    // ─────────────────────────────────────────────────────────────────────────────
    var activePresetLabel = document.getElementById('active-preset-label');
    if (activePresetLabel) activePresetLabel.textContent = '';
    renderStack();
    refreshPreview();

  </script>
</body>
</html>
